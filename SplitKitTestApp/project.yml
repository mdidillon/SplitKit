name: SplitKitTestApp
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SplitKit:
    path: ../SplitKit
  SplitKitViews:
    path: ../SplitKitViews
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.mdidillon.SplitKitTestApp
targets:
  SplitKitTestApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [HostSampleApp.swift]
    dependencies:
      - package: SplitKit
        product: SplitKit
      - package: SplitKit
        product: SplitKitContent
      - package: SplitKit
        product: SplitKitModel
      - package: SplitKitViews
        product: ImageViewer
      - package: SplitKitViews
        product: ModelViewer3D
  # Host mode (spec §9): the host owns its main window and embeds SplitKitView. Shares the dummy contents.
  SplitKitHostSample:
    type: application
    platform: macOS
    sources:
      - path: Sources
        includes: [HostSampleApp.swift, DummyContents.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdidillon.SplitKitHostSample
    dependencies:
      - package: SplitKit
        product: SplitKit
      - package: SplitKit
        product: SplitKitContent
      - package: SplitKit
        product: SplitKitModel
schemes:
  SplitKitTestApp:
    build:
      targets:
        SplitKitTestApp: all
    run:
      config: Debug
  SplitKitHostSample:
    build:
      targets:
        SplitKitHostSample: all
    run:
      config: Debug
