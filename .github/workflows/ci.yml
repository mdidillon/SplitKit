name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.x, preferring 27.1 (R-TOOL; approved deviation, spec §1)
        run: |
          # Pin is Xcode 27.x on the xcode-27 preview image until 27.1 is available there
          # (actions/runner-images#14850). Preferring 27.1 over newer betas is an approved deviation (spec §1, §11.1).
          # Preference: exactly 27.1 (incl. its RC) > newest non-beta 27.x > newest 27.x beta.
          best=""; bestv=""; bestrank=9
          for app in /Applications/Xcode*.app; do
            [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] || continue
            [ -L "$app" ] && continue
            v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null) || continue
            echo "found $app -> $v"
            case "$v" in 27|27.*) ;; *) continue ;; esac
            case "$v" in 27.1|27.1.*) rank=0 ;; *) case "$app" in *[Bb]eta*) rank=2 ;; *) rank=1 ;; esac ;; esac
            if [ "$rank" -lt "$bestrank" ] || { [ "$rank" -eq "$bestrank" ] && [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -n 1)" = "$v" ]; }; then
              best="$app"; bestv="$v"; bestrank=$rank
            fi
          done
          if [ -z "$best" ]; then echo "::error::No Xcode 27.x found on runner"; exit 1; fi
          sudo xcode-select -s "$best/Contents/Developer"
          echo "Selected $best ($bestv)"
          xcodebuild -version
          swift --version
          if ! xcodebuild -version | head -n 1 | grep -Eq '^Xcode 27(\.|$)'; then
            echo "::error::Active Xcode is not 27.x"
            exit 1
          fi
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version >> "$GITHUB_STEP_SUMMARY"
          swift --version >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"

      - name: Check tools version (R-TOOL)
        run: |
          for m in SplitKit/Package.swift SplitKitViews/Package.swift; do
            if [ "$(head -n 1 "$m")" != "// swift-tools-version: 6.2" ]; then
              echo "::error::$m must start with '// swift-tools-version: 6.2'"
              exit 1
            fi
          done

      - name: swift test (SplitKit)
        run: swift test
        working-directory: SplitKit

      - name: swift test (SplitKitViews)
        run: swift test
        working-directory: SplitKitViews

      - name: xcodebuild (SplitKitTestApp)
        run: >
          xcodebuild -project SplitKitTestApp/SplitKitTestApp.xcodeproj
          -scheme SplitKitTestApp build CODE_SIGNING_ALLOWED=NO
